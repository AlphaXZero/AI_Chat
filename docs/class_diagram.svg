@startuml
class User {
  id: int
  name: string
  email: string
  password: string
  favorite_ia: string
  shortcut: json
}
class AiSetting {
  id: int
  setting: string
  value: string
}
class Conversation {
  id: int
  title: string
  favorite_ia: string
  created_at: timestamp
  updated_at: timestamp
  insanity: int
}
class Message {
  id: int
  role: string
  content: string
  created_at: timestamp
}
class Image {
  id: int
  url: string
  placeholder: string
}
User "1" - - "0..*" Conversation : has >
